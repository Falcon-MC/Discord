name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve version and changelog
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: resolve
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
            echo "Version must look like X.Y.Z, got '$VERSION'" >&2
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Build changelog
        id: changelog
        env:
          COMMIT_BASE: ${{ github.server_url }}/${{ github.repository }}/commit
        run: |
          set -euo pipefail

          PREVIOUS="$(git tag --list 'v*' --sort=-creatordate | grep -v "^${{ steps.resolve.outputs.tag }}$" | head -n 1 || true)"
          RANGE="HEAD"
          if [ -n "$PREVIOUS" ]; then
            RANGE="${PREVIOUS}..HEAD"
          fi

          {
            echo "changelog<<CHANGELOG_EOF"
            echo "### Changes"
            echo ""
            git log --no-merges --reverse --pretty=format:"- [\`%h\`](${COMMIT_BASE}/%H) %s" "$RANGE"
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build linux-x64
    needs: prepare
    runs-on: ubuntu-24.04
    container: debian:bookworm

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake git ninja-build ca-certificates \
            libssl-dev zlib1g-dev

      - uses: actions/checkout@v4

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: build
          key: release-linux-x64-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            release-linux-x64-${{ hashFiles('CMakeLists.txt') }}-
            release-linux-x64-

      - name: Configure and build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build build

      - name: Stage the executable
        run: |
          set -eu
          mkdir -p dist
          cp build/FalconDiscord dist/FalconDiscord-linux-x64
          strip dist/FalconDiscord-linux-x64
          cd dist
          sha256sum FalconDiscord-linux-x64 > FalconDiscord-linux-x64.sha256
          ldd FalconDiscord-linux-x64

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FalconDiscord-linux-x64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04

    steps:
      - name: Download the build artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        uses: ncipollo/release-action@v1.15.0
        with:
          artifacts: "artifacts/*"
          tag: ${{ needs.prepare.outputs.tag }}
          commit: ${{ github.sha }}
          name: Falcon Discord ${{ needs.prepare.outputs.version }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            | Platform | Download |
            | --- | --- |
            | Linux x64 | `FalconDiscord-linux-x64` |

            The binary is statically linked against D++, OpenSSL and zlib and ships with a `.sha256` checksum.

            ${{ needs.prepare.outputs.changelog }}
